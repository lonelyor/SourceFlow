<!DOCTYPE html>
<html>
<head>
    <title>SourceFlow</title>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <style>
        body {
            margin: 0;
            background-color: #fff;
            text-align: center;
            color: #222;
            font-size: 16px;
            font-family: BlinkMacSystemFont, Helvetica, "PingFang SC", "Luxi Sans", "DejaVu Sans", arial, "Microsoft Yahei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Twemoji Mozilla", "Android Emoji", "EmojiSymbols";
        }

        .fn__flex-column {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin: 0 auto;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 0 calc((100vw - 608px) * 0.3);
        }

        .fn__flex-1 {
            flex: 1;
            min-height: 32px;
            flex-shrink: 0;
            min-width: 8px;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 28px;
        }

        .b3-select {
            border-radius: 6px;
            color: #222;
            height: 28px;
            width: 96px;
            border: 0;
            padding: 4px 26px 4px 8px;
            box-sizing: border-box;
            line-height: 20px;
            transition: box-shadow 120ms 0ms cubic-bezier(0, 0, 0.2, 1), background-color 0.2s cubic-bezier(0, 0, 0.2, 1) 0ms;
            font-size: 14px;
            box-shadow: inset 0 0 0 0.6px #5f6368;
            background: url("data:image/svg+xml;utf8,<svg fill='rgba(95, 99, 104, .68)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") no-repeat right 2px center #fff;
            appearance: none;
            cursor: pointer;
            overflow: hidden;
        }

        .b3-select:focus {
            box-shadow: inset 0 0 0 1px #3575f0, 0 0 0 3px rgba(53, 117, 240, .12);
        }

        .b3-button {
            color: #fff;
            border-radius: 6px;
            line-height: 20px;
            padding: 4px 8px;
            background-color: #3575f0;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 280ms cubic-bezier(0.4, 0, 0.2, 1);
            border: 0;
            box-sizing: border-box;
            text-align: center;
            width: 96px;
            cursor: pointer;
        }

        .b3-button:hover, .b3-button:focus {
            text-decoration: none;
            box-shadow: 0 5px 5px -3px rgb(0 0 0 / .2), 0 8px 10px 1px rgb(0 0 0 / .14), 0 3px 14px 2px rgb(0 0 0 / .12);
        }

        .b3-button:active {
            box-shadow: 0 5px 5px -3px rgba(0, 0, 0, 0.2), 0 8px 10px 1px rgba(0, 0, 0, 0.14), 0 3px 14px 2px rgba(0, 0, 0, 0.12);
        }

        .b3-label {
            padding: 16px 24px 0;
            margin-bottom: 16px;
            display: flex;
            text-align: left;
            box-shadow: 0 15px 0 0 #fff, 0 16px 0 0 #e0e0e0;
        }

        .workspace-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .migration-actions {
            width: 360px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: stretch;
        }

        .migration-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .b3-text-field {
            flex: 1;
            min-width: 0;
            border-radius: 6px;
            color: #222;
            height: 28px;
            border: 0;
            padding: 4px 8px;
            box-sizing: border-box;
            line-height: 20px;
            font-size: 14px;
            box-shadow: inset 0 0 0 0.6px #5f6368;
            background-color: #fff;
        }

        .b3-text-field:focus {
            outline: none;
            box-shadow: inset 0 0 0 1px #3575f0, 0 0 0 3px rgba(53, 117, 240, .12);
        }

        .migration-row .b3-button {
            width: 88px;
            flex-shrink: 0;
        }

        .migration-submit {
            display: flex;
            justify-content: flex-end;
        }

        .migration-submit .b3-button {
            width: 120px;
        }

        .migration-status {
            min-height: 18px;
            white-space: pre-wrap;
        }

        .migration-status[data-tone="success"] {
            color: var(--b3-theme-primary, #4285f4);
        }

        .migration-status[data-tone="error"] {
            color: #d23f31;
        }

        .b3-button--outline {
            background-color: transparent;
            color: #3575f0;
            box-shadow: inset 0 0 0 1px rgba(53, 117, 240, .35);
        }

        .b3-label__text {
            color: #5f6368;
            font-size: 14px;
            margin-top: 4px;
            overflow: hidden;
            line-height: 1.65;
        }

        .fn__flex-center {
            align-self: center;
        }

        .svg {
            position: fixed;
            right: 32px;
            top: 0;
            width: 13px;
            fill: #5f6368;
            padding: 9.5px;
            cursor: pointer;
            z-index: 1;
        }

        .svg:hover {
            background: #dfe0e1;
            fill: #222;
        }

        #close {
            right: 0;
            width: 10px;
            padding: 11px 11px;
        }

        #close:hover {
            background-color: #d23f31;
            fill: #fff;
        }

        a {
            text-decoration: none;
            color: #3575f0;
        }

        a:hover {
            text-decoration: underline;
        }

        .fn__none {
            display: none !important;
        }

        .slogan {
            color: #5f6368;
            font-size: 15px;
        }

        .notice {
            font-size: 14px;
            color: #5f6368;
        }

        .icon {
            width: 96px;
            margin: 0 auto 16px;
        }

        kbd {
            font: 75% SFMono-Regular, Consolas, "Liberation Mono";
            line-height: 1;
            border-radius: 6px;
            padding: 2px 4px;
            color: #5f6368;
            vertical-align: middle;
            background-color: #f6f6f6;
            border: solid 1px #e0e0e0;
            box-shadow: inset 0 -1px 0 #e0e0e0;
        }

        .feedback {
            display: flex;
            justify-content: space-around;
            font-size: 14px
        }

        .drag {
            -webkit-app-region: drag;
            height: 32px;
            cursor: pointer;
            position: fixed;
            top: 0;
            left: 0;
            right: 64px;
        }

        .darwin #min,
        .darwin #close {
            display: none;
        }

        .darwin .drag {
            right: 0;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1e1e1e;
                color: #dadada;
            }

            .b3-select {
                color: #dadada;
                box-shadow: inset 0 0 0 0.6px #9aa0a6;
                background: url("data:image/svg+xml;utf8,<svg fill='rgba(154, 160, 166, .68)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") no-repeat right 2px center #1e1e1e;
            }

            .b3-select:focus {
                box-shadow: inset 0 0 0 1px #3573f0, 0 0 0 3px rgba(53, 115, 240, .24);
            }

            .b3-button {
                background-color: #3573f0;
            }

            .b3-label {
                box-shadow: 0 15px 0 0 #1e1e1e, 0 16px 0 0 #363636;
            }

            .b3-button--outline {
                color: #7fa9ff;
                box-shadow: inset 0 0 0 1px rgba(127, 169, 255, .35);
            }

            .b3-text-field {
                color: #dadada;
                box-shadow: inset 0 0 0 0.6px #9aa0a6;
                background-color: #1e1e1e;
            }

            .b3-text-field:focus {
                box-shadow: inset 0 0 0 1px #3573f0, 0 0 0 3px rgba(53, 115, 240, .24);
            }

            .b3-label__text {
                color: #9aa0a6;
            }

            .svg {
                fill: #9aa0a6;
            }

            .svg:hover {
                background: rgba(255, 255, 255, .075);
                fill: #dadada;
            }

            a {
                color: #3573f0;
            }

            .slogan {
                color: #9aa0a6;
            }

            .notice {
                color: #9aa0a6;
            }

            kbd {
                color: #9aa0a6;
                background-color: #262626;
                border: solid 1px rgba(230, 230, 230, .06);
                box-shadow: inset 0 -1px 0 rgba(230, 230, 230, .06);
            }
        }
    </style>
</head>
<body>
<div id="zhCN" class="fn__flex-column">
    <div class="fn__flex-1"></div>
    <img class="icon">
    <h2>源流 SourceFlow</h2>
    <div class="slogan">流动知识，沉淀洞见</div>
    <div class="fn__flex-1"></div>
    <label class="b3-label">
        <div>
            🌐 外观语言
            <div class="b3-label__text">用户界面语言，后续可以在 <kbd>设置</kbd> - <kbd>外观</kbd> 中进行切换</div>
        </div>
        <div class="fn__flex-1"></div>
        <select class="b3-select lang">
            <option value="en_US">English</option>
            <option value="zh_CN">简体中文</option>
        </select>
    </label>
    <label class="b3-label">
        <div>
            🔁 迁移旧工作区
            <div class="b3-label__text">把旧版工作区复制到一个新的 SourceFlow 工作区。迁移成功前不会修改原始工作区，并会自动清理旧同步残留和失效路径配置，尽量做到迁移后开箱即用。</div>
        </div>
        <div class="fn__flex-1"></div>
        <div class="migration-actions">
            <div class="migration-row">
                <input class="b3-text-field migration-source" placeholder="源工作区地址">
                <button class="b3-button b3-button--outline browseMigrationSource">浏览</button>
            </div>
            <div class="migration-row">
                <input class="b3-text-field migration-target" placeholder="目标工作区地址（会根据源工作区自动预填）">
                <button class="b3-button b3-button--outline browseMigrationTarget">浏览</button>
            </div>
            <div class="migration-submit">
                <button class="b3-button runMigration">开始迁移</button>
            </div>
            <div class="b3-label__text migration-status"></div>
        </div>
    </label>
    <label class="b3-label">
        <div>
            🗂️ 工作空间
            <div class="b3-label__text"> 工作空间用于存放数据，后续可以在顶栏左上角的主菜单中进行切换</div>
            <div class="b3-label__text fn__none portableNoticeZh">便携模式首次启动需要选择工作区。笔记数据保存在工作区中，程序可能会在系统目录写入少量辅助缓存（如最近工作区记录）；迁移时复制程序文件和工作空间即可。</div>
        </div>
        <div class="fn__flex-1"></div>
        <div class="workspace-actions">
            <button class="b3-button fn__flex-center choosePath">选择</button>
        </div>
    </label>
    <div class="fn__flex-1"></div>
    <div class="fn__flex-1 notice">
        <span>⚠️ 请勿使用第三方同步盘同步数据，否则会导致运行异常和数据损坏</span>
    </div>
    <div class="feedback">
        <span>🏘️ <a href="https://github.com/lonelyor/SourceFlow" target="_blank">GitHub / 社区入口</a></span>
    </div>
    <div class="fn__flex-1"></div>
</div>
<div class="fn__none fn__flex-column" id="enUS">
    <div class="fn__flex-1"></div>
    <img class="icon">
    <h2>SourceFlow</h2>
    <div class="slogan">Let knowledge flow and insight stay</div>
    <div class="fn__flex-1"></div>
    <label class="b3-label">
        <div>
            🌐 Language
            <div class="b3-label__text">User interface language, which can be switched later in <kbd>Settings</kbd> -
                <kbd>Appearance</kbd>
            </div>
        </div>
        <div class="fn__flex-1"></div>
        <select class="b3-select lang">
            <option value="en_US">English</option>
            <option value="zh_CN">简体中文</option>
        </select>
    </label>
    <label class="b3-label">
        <div>
            🔁 Migrate Legacy Workspace
            <div class="b3-label__text">Copy a legacy workspace into a new SourceFlow workspace. The original workspace will not be modified before migration succeeds, and SourceFlow will automatically clean up legacy sync residue and broken path settings so the migrated workspace is ready to use.</div>
        </div>
        <div class="fn__flex-1"></div>
        <div class="migration-actions">
            <div class="migration-row">
                <input class="b3-text-field migration-source" placeholder="Source workspace path">
                <button class="b3-button b3-button--outline browseMigrationSource">Browse</button>
            </div>
            <div class="migration-row">
                <input class="b3-text-field migration-target" placeholder="Target workspace path (auto-filled from the source workspace)">
                <button class="b3-button b3-button--outline browseMigrationTarget">Browse</button>
            </div>
            <div class="migration-submit">
                <button class="b3-button runMigration">Migrate</button>
            </div>
            <div class="b3-label__text migration-status"></div>
        </div>
    </label>
    <label class="b3-label">
        <div>
            🗂️ Workspace
            <div class="b3-label__text">The workspace is used to store data, which can be switched later in the top bar
                menu later
            </div>
            <div class="b3-label__text fn__none portableNoticeEn">Portable mode asks you to choose a workspace on first launch. Notes stay in the workspace, while a small amount of helper cache, such as recent workspace records, may be stored in the system profile. For migration, copy the program files together with the workspace.</div>
        </div>
        <div class="fn__flex-1"></div>
        <div class="workspace-actions">
            <button class="b3-button fn__flex-center choosePath">Select</button>
        </div>
    </label>
    <div class="fn__flex-1"></div>
    <div class="fn__flex-1 notice">
        <span>⚠️ Do not use a third-party sync disk to sync data, otherwise it will cause abnormal operation and data damage</span>
    </div>
    <div class="feedback">
        <span>🏘️ <a href="https://github.com/lonelyor/SourceFlow" target="_blank">GitHub / Community</a></span>
    </div>
    <div class="fn__flex-1"></div>
</div>
<svg class="svg" id="min" viewBox="0 0 32 32">
    <path d="M1.333 14.667h29.333q1.333 0 1.333 1.333v0q0 1.333-1.333 1.333h-29.333q-1.333 0-1.333-1.333v0q0-1.333 1.333-1.333z"></path>
</svg>
<svg class="svg" id="close" viewBox="0 0 32 32">
    <path d="M32 3.221l-12.779 12.779 12.779 12.779-3.221 3.221-12.779-12.779-12.779 12.779-3.221-3.221 12.779-12.779-12.779-12.779 3.221-3.221 12.779 12.779 12.779-12.779z"></path>
</svg>
<div class="drag"></div>
<script>
    const isChinese = (lang) => {
        return 'zh_CN' === lang
    }

    const normalizeLang = (lang) => {
        if (lang && lang.startsWith('zh')) {
            return 'zh_CN'
        }
        return 'en_US'
    }

    const getSearch = (key) => {
        if (window.location.search.indexOf('?') === -1) {
            return ''
        }
        let value = ''
        const data = window.location.search.split('?')[1].split('&')
        data.find(item => {
            const keyValue = item.split('=')
            if (keyValue[0] === key) {
                value = keyValue[1]
                return true
            }
        })
        return value
    }

    const getDefaultWorkspace = () => {
        const customDefaultWorkspace = decodeURIComponent(getSearch('defaultWorkspace'))
        if (customDefaultWorkspace) {
            return customDefaultWorkspace
        }

        const path = require('path')
        let defaultWorkspace = path.join(decodeURIComponent(getSearch('home')), "SourceFlow")
        if ("darwin" === process.platform) {
            // Change the initial workspace path to ~/Library/Application Support/SourceFlow on macOS
            defaultWorkspace = path.join(decodeURIComponent(getSearch('home')), "Library", "Application Support", "SourceFlow")
        }
        return defaultWorkspace
    }

    const getPortableRoot = () => {
        return decodeURIComponent(getSearch('portableRoot'))
    }

    const migrationDefaultLeafName = 'sourceflow-Notes'

    let currentLang = normalizeLang(decodeURIComponent(getSearch('lang')))
    let lastAutoMigrationTarget = ''
    const setLang = (lang) => {
        if (isChinese(lang)) {
            document.title = `源流 SourceFlow v${getSearch('v')}`
            document.getElementById('zhCN').classList.remove('fn__none')
            document.getElementById('enUS').classList.add('fn__none')
        } else {
            document.title = `SourceFlow v${getSearch('v')}`
            document.getElementById('zhCN').classList.add('fn__none')
            document.getElementById('enUS').classList.remove('fn__none')
        }
        currentLang = lang
    }
    setLang(currentLang)

    document.querySelectorAll('.version').forEach(item => {
        item.textContent = `v${getSearch('v')}`
    })

    document.querySelectorAll('.icon').forEach(item => {
        item.src = decodeURIComponent(`${getSearch('icon')}`)
    })

    document.querySelectorAll('.lang').forEach(item => {
        item.value = currentLang
        item.addEventListener('change', () => {
            document.querySelectorAll('.lang').forEach(item1 => {
                item1.value = item.value
            })
            setLang(item.value)
        })
    })

    if (getPortableRoot()) {
        document.querySelectorAll('.portableNoticeZh, .portableNoticeEn').forEach(item => {
            item.classList.remove('fn__none')
        })
    }

    if (process.platform === 'darwin') {
        document.body.classList.add('darwin');
    }

    const path = require('path')
    const fs = require('fs')

    const setMirroredValue = (selector, value) => {
        document.querySelectorAll(selector).forEach(item => {
            item.value = value
        })
    }

    const setMirroredText = (selector, value) => {
        document.querySelectorAll(selector).forEach(item => {
            item.textContent = value
        })
    }

    const setMigrationStatus = (message = '', tone = '') => {
        document.querySelectorAll('.migration-status').forEach(item => {
            item.textContent = message
            if (tone) {
                item.dataset.tone = tone
            } else {
                delete item.dataset.tone
            }
        })
    }

    const waitForMigrationUIRefresh = () => {
        return new Promise(resolve => {
            requestAnimationFrame(() => {
                setTimeout(resolve, 0)
            })
        })
    }

    const getMigrationSource = () => {
        return document.querySelector('.migration-source')?.value?.trim() || ''
    }

    const getMigrationTarget = () => {
        return document.querySelector('.migration-target')?.value?.trim() || ''
    }

    const normalizeSourceWorkspacePath = (sourcePath) => {
        const normalizedSource = `${sourcePath || ''}`.trim()
        if (!normalizedSource) {
            return ''
        }
        return path.resolve(normalizedSource)
    }

    const normalizeTargetWorkspacePath = (sourcePath, targetPath) => {
        const normalizedTarget = `${targetPath || ''}`.trim()
        if (!normalizedTarget) {
            return ''
        }
        if (path.isAbsolute(normalizedTarget)) {
            return path.resolve(normalizedTarget)
        }
        const normalizedSource = normalizeSourceWorkspacePath(sourcePath)
        if (!normalizedSource) {
            return path.resolve(normalizedTarget)
        }
        return path.join(path.dirname(normalizedSource), normalizedTarget)
    }

    const getDefaultMigrationTarget = (sourcePath) => {
        const normalizedSource = normalizeSourceWorkspacePath(sourcePath)
        if (!normalizedSource) {
            return ''
        }
        return path.join(path.dirname(normalizedSource), migrationDefaultLeafName)
    }

    const isFilesystemRoot = (targetPath) => {
        if (!targetPath) {
            return false
        }
        const resolvedPath = path.resolve(targetPath)
        return resolvedPath === path.parse(resolvedPath).root
    }

    const getAvailableMigrationTarget = (targetPath) => {
        const normalizedTarget = `${targetPath || ''}`.trim()
        if (!normalizedTarget) {
            return ''
        }
        if (!fs.existsSync(normalizedTarget)) {
            return normalizedTarget
        }

        let index = 2
        while (true) {
            const candidate = `${normalizedTarget}-${index}`
            if (!fs.existsSync(candidate)) {
                return candidate
            }
            index += 1
        }
    }

    const prepareMigrationTarget = (sourceWorkspace, targetWorkspace) => {
        const normalizedSource = syncMigrationSourceDisplay(sourceWorkspace)
        let normalizedTarget = syncMigrationTargetDisplay(normalizedSource, targetWorkspace)
        const notices = []

        if (!normalizedTarget || isFilesystemRoot(normalizedTarget) || normalizedTarget === normalizedSource) {
            normalizedTarget = getDefaultMigrationTarget(normalizedSource)
            notices.push(isChinese(currentLang)
                ? '目标路径无效，已自动修正为源工作区同级的 sourceflow-Notes。'
                : 'The target path was invalid, so it was automatically corrected to a sibling sourceflow-Notes path.')
        }

        if (normalizedTarget && fs.existsSync(normalizedTarget)) {
            const suggestedTarget = getAvailableMigrationTarget(normalizedTarget)
            if (suggestedTarget !== normalizedTarget) {
                normalizedTarget = suggestedTarget
                notices.push(isChinese(currentLang)
                    ? `目标路径已存在，已自动调整为可用的新路径：\n${normalizedTarget}`
                    : `The target path already exists, so it was automatically adjusted to an available new path:\n${normalizedTarget}`)
            }
        }

        if (normalizedTarget) {
            setMirroredValue('.migration-target', normalizedTarget)
        }

        return { normalizedSource, normalizedTarget, notices }
    }

    const recoverMigrationFailure = (sourceWorkspace, targetWorkspace, message) => {
        const rawMessage = `${message || ''}`
        if (!rawMessage) {
            return []
        }

        const notices = []
        if (rawMessage.includes('filesystem root path') || rawMessage.includes('must be different from the source workspace')) {
            const fallbackTarget = getDefaultMigrationTarget(sourceWorkspace)
            if (fallbackTarget) {
                setMirroredValue('.migration-target', fallbackTarget)
                notices.push(isChinese(currentLang)
                    ? `已自动修正目标路径为：\n${fallbackTarget}`
                    : `The target path was automatically corrected to:\n${fallbackTarget}`)
            }
        } else if (rawMessage.includes('already exists')) {
            const fallbackTarget = getAvailableMigrationTarget(targetWorkspace)
            if (fallbackTarget && fallbackTarget !== targetWorkspace) {
                setMirroredValue('.migration-target', fallbackTarget)
                notices.push(isChinese(currentLang)
                    ? `目标路径已存在，已为你生成一个新路径：\n${fallbackTarget}`
                    : `The target path already exists. A new available path has been prepared for you:\n${fallbackTarget}`)
            }
        }

        return notices
    }

    const syncMigrationSourceDisplay = (sourcePath) => {
        const normalizedSource = normalizeSourceWorkspacePath(sourcePath)
        if (normalizedSource && normalizedSource !== sourcePath) {
            setMirroredValue('.migration-source', normalizedSource)
        }
        return normalizedSource
    }

    const syncMigrationTargetDisplay = (sourcePath, targetPath) => {
        const normalizedTarget = normalizeTargetWorkspacePath(sourcePath, targetPath)
        if (normalizedTarget && normalizedTarget !== `${targetPath || ''}`.trim()) {
            setMirroredValue('.migration-target', normalizedTarget)
        }
        return normalizedTarget
    }

    const maybePrefillMigrationTarget = (sourcePath, force = false) => {
        const normalizedSource = syncMigrationSourceDisplay(sourcePath)
        if (!normalizedSource) {
            return
        }

        const currentTarget = getMigrationTarget()
        const normalizedCurrentTarget = syncMigrationTargetDisplay(normalizedSource, currentTarget)
        const nextAutoTarget = getDefaultMigrationTarget(normalizedSource)
        const shouldReplace = force || !normalizedCurrentTarget || normalizedCurrentTarget === lastAutoMigrationTarget

        if (shouldReplace) {
            setMirroredValue('.migration-target', nextAutoTarget)
        }
        lastAutoMigrationTarget = nextAutoTarget
    }

    document.getElementById('close').addEventListener('click', () => {
        const {ipcRenderer} = require('electron')
        ipcRenderer.send('sourceflow-first-quit')
    })
    document.getElementById('min').addEventListener('click', () => {
        const {ipcRenderer} = require('electron')
        ipcRenderer.send("sourceflow-cmd", "minimize");
    })

    document.querySelectorAll('.choosePath').forEach((item) => {
        item.addEventListener('click', async () => {
            const fs = require('fs')
            const defaultWorkspace = getDefaultWorkspace()
            if (!fs.existsSync(defaultWorkspace)) {
                fs.mkdirSync(defaultWorkspace, {mode: 0o755, recursive: true})
            }

            const {ipcRenderer} = require('electron')
            const result = await ipcRenderer.invoke("sourceflow-get", {
                cmd: "showOpenDialog",
                defaultPath: defaultWorkspace,
                properties: ['openDirectory', 'createDirectory'],
            });

            if (result.canceled) {
                return
            }
            const initPath = result.filePaths[0]

            if (isPartitionRootPath(initPath)) {
                let msg = '⚠️ Do not create the workspace in the partition root path, please create a new folder as the workspace'
                if (isChinese(currentLang)) {
                    msg = '⚠️ 请勿在分区根路径上创建工作空间，请新建一个文件夹作为工作空间'
                }
                alert(msg)
                return
            }

            if (!isWorkspaceDir(initPath) && !isEmptyDir(initPath)) {
                let msg = '⚠️ This folder contains other files, please create a new folder as the workspace'
                if (isChinese(currentLang)) {
                    msg = '⚠️ 该文件夹包含了其他文件，请新建一个文件夹作为工作空间'
                }
                alert(msg)
                return
            }

            if (isICloudPath(initPath)) {
                let msg = '⚠️ This folder is under the iCloud sync path, please change another path'
                if (isChinese(currentLang)) {
                    msg = '⚠️ 该文件夹位于 iCloud 同步路径下，请更换其他路径'
                }
                alert(msg)
                return
            }

            if (isCloudDrivePath(initPath)) {
                let msg = '⚠️ The folder path can not contain onedrive, dropbox, google drive, pcloud and 坚果云, please change another path'
                if (isChinese(currentLang)) {
                    msg = '⚠️ 文件夹路径不能包含 onedrive、dropbox、google drive、pcloud 和 坚果云，请更换其他路径'
                }
                alert(msg)
                return
            }
            let msg = '⚠️ Please confirm that the workspace is not set under the path of a third-party sync disk, otherwise it will cause data damage (iCloud/OneDrive/Dropbox/Google Drive/Nutstore/Baidu Netdisk/Tencent Weiyun, etc.), continue?'
            if (isChinese(currentLang)) {
                msg = '⚠️ 请确认没有将工作空间设置在第三方同步盘路径下，否则会造成数据损坏（iCloud/OneDrive/Dropbox/Google Drive/坚果云/百度网盘/腾讯微云等），是否继续？'
            }
            if (!confirm(msg)) {
                return
            }
            if (!fs.existsSync(initPath)) {
                fs.mkdirSync(initPath, {mode: 0o755, recursive: true})
            }
            ipcRenderer.send('sourceflow-first-init', {
                workspace: initPath,
                lang: document.querySelector('.lang').value
            })
        })
    })

    document.querySelectorAll('.migration-source').forEach((item) => {
        item.addEventListener('input', () => {
            setMirroredValue('.migration-source', item.value)
        })
        item.addEventListener('change', () => {
            maybePrefillMigrationTarget(item.value)
        })
    })

    document.querySelectorAll('.migration-target').forEach((item) => {
        item.addEventListener('input', () => {
            setMirroredValue('.migration-target', item.value)
        })
        item.addEventListener('change', () => {
            const normalizedSource = syncMigrationSourceDisplay(getMigrationSource())
            const normalizedTarget = syncMigrationTargetDisplay(normalizedSource, item.value)
            if (normalizedSource && normalizedTarget === getDefaultMigrationTarget(normalizedSource)) {
                lastAutoMigrationTarget = normalizedTarget
            }
        })
    })

    document.querySelectorAll('.browseMigrationSource').forEach((item) => {
        item.addEventListener('click', async () => {
            const {ipcRenderer} = require('electron')
            const currentSource = getMigrationSource()
            const fallbackPath = currentSource || decodeURIComponent(getSearch('home'))
            const result = await ipcRenderer.invoke("sourceflow-get", {
                cmd: "showOpenDialog",
                defaultPath: fallbackPath,
                properties: ['openDirectory'],
            })
            if (result.canceled) {
                return
            }
            const selectedPath = result.filePaths[0]
            setMirroredValue('.migration-source', selectedPath)
            setMigrationStatus(
                isChinese(currentLang)
                    ? '已选择源工作区，正在生成目标工作区地址…'
                    : 'Source workspace selected. Preparing the target workspace path…',
                'info'
            )
            await waitForMigrationUIRefresh()
            maybePrefillMigrationTarget(selectedPath, true)
            const autoTarget = getMigrationTarget()
            setMigrationStatus(
                autoTarget
                    ? (isChinese(currentLang)
                        ? `已自动预填目标工作区：\n${autoTarget}`
                        : `Target workspace auto-filled:\n${autoTarget}`)
                    : (isChinese(currentLang)
                        ? '已选择源工作区。'
                        : 'Source workspace selected.'),
                autoTarget ? 'success' : 'info'
            )
        })
    })

    document.querySelectorAll('.browseMigrationTarget').forEach((item) => {
        item.addEventListener('click', async () => {
            const {ipcRenderer} = require('electron')
            const currentTarget = getMigrationTarget()
            const fallbackPath = currentTarget ? path.dirname(currentTarget) : (getMigrationSource() ? path.dirname(getMigrationSource()) : decodeURIComponent(getSearch('home')))
            const result = await ipcRenderer.invoke("sourceflow-get", {
                cmd: "showOpenDialog",
                defaultPath: fallbackPath,
                properties: ['openDirectory', 'createDirectory'],
            })
            if (result.canceled) {
                return
            }
            const targetPath = path.join(result.filePaths[0], migrationDefaultLeafName)
            setMirroredValue('.migration-target', targetPath)
            setMigrationStatus(
                isChinese(currentLang)
                    ? `已设置目标工作区：\n${targetPath}`
                    : `Target workspace set to:\n${targetPath}`,
                'success'
            )
        })
    })

    document.querySelectorAll('.runMigration').forEach((item) => {
        item.addEventListener('click', async () => {
            const sourceWorkspace = syncMigrationSourceDisplay(getMigrationSource())
            if (!sourceWorkspace) {
                alert(isChinese(currentLang) ? '⚠️ 请输入源工作区地址' : '⚠️ Please enter the source workspace path')
                return
            }
            const prepared = prepareMigrationTarget(sourceWorkspace, getMigrationTarget())
            let targetWorkspace = prepared.normalizedTarget
            if (!targetWorkspace) {
                alert(isChinese(currentLang) ? '⚠️ 请输入目标工作区地址' : '⚠️ Please enter the target workspace path')
                return
            }
            if (prepared.notices.length > 0) {
                alert(prepared.notices.join('\n\n'))
            }

            let confirmMessage = `Source workspace:\n${sourceWorkspace}\n\nTarget workspace:\n${targetWorkspace}\n\nThe original workspace will not be modified. Continue?`
            if (isChinese(currentLang)) {
                confirmMessage = `源工作区：\n${sourceWorkspace}\n\n目标工作区：\n${targetWorkspace}\n\n原始工作区不会被修改，是否继续？`
            }
            if (!confirm(confirmMessage)) {
                return
            }

            const {ipcRenderer} = require('electron')
            document.querySelectorAll('.runMigration, .browseMigrationSource, .browseMigrationTarget').forEach(button => {
                button.disabled = true
            })
            setMigrationStatus(
                isChinese(currentLang)
                    ? '正在迁移工作区，请稍候…'
                    : 'Migrating workspace, please wait…',
                'info'
            )
            try {
                const result = await ipcRenderer.invoke("sourceflow-get", {
                    cmd: "runWorkspaceMigration",
                    sourceWorkspace,
                    targetWorkspace,
                })
                if (!result?.ok) {
                    const recoveryNotices = recoverMigrationFailure(sourceWorkspace, targetWorkspace, result?.message || '')
                    let msg = `⚠️ Migration failed.\n${result?.message || ''}`.trim()
                    if (isChinese(currentLang)) {
                        msg = `⚠️ 迁移失败。\n${result?.message || ''}`.trim()
                    }
                    if (recoveryNotices.length > 0) {
                        msg += `\n\n${recoveryNotices.join('\n\n')}`
                    }
                    setMigrationStatus(msg, 'error')
                    alert(msg)
                    return
                }
                let msg = `Migration completed successfully.\n\nTarget workspace:\n${targetWorkspace}`
                if (isChinese(currentLang)) {
                    msg = `迁移成功。\n\n目标工作区：\n${targetWorkspace}`
                }
                setMigrationStatus(msg, 'success')
                alert(msg)
            } finally {
                document.querySelectorAll('.runMigration, .browseMigrationSource, .browseMigrationTarget').forEach(button => {
                    button.disabled = false
                })
            }
        })
    })

    const isPartitionRootPath = (absPath) => {
        const path = require('path')
        const parsedPath = path.parse(absPath)
        return parsedPath.root === absPath
    }

    const isEmptyDir = (absPath) => {
        const fs = require('fs')
        let files;
        try {
            files = fs.readdirSync(absPath).filter(file => file !== '.DS_Store')
        } catch (err) {
            return false
        }
        return 0 === files.length
    }

    const isWorkspaceDir = (absPath) => {
        const path = require('path');
        const fs = require('fs');
        const conf = path.join(absPath, 'conf', 'conf.json');
        let data;
        try {
            data = fs.readFileSync(conf, 'utf8');
        } catch (err) {
            return false;
        }
        return data.includes('kernelVersion');
    }

    const isCloudDrivePath = (absPath) => {
        const absPathLower = absPath.toLowerCase()
        return -1 < absPathLower.indexOf("onedrive") || -1 < absPathLower.indexOf("dropbox") ||
            -1 < absPathLower.indexOf("google drive") || -1 < absPathLower.indexOf("pcloud") ||
            -1 < absPathLower.indexOf("坚果云")
    }

    const isICloudPath = (absPath) => {
        const os = require('os')
        if ('darwin' !== os.platform()) {
            return false
        }

        // macOS 端对工作空间放置在 iCloud 路径下做检查 https://github.com/lonelyor/SourceFlow/issues/7747
        const path = require('path')
        const homePath = decodeURIComponent(getSearch('home'))
        const absPathLower = absPath.toLowerCase()
        const iCloudRoot = path.join(homePath, 'Library', 'Mobile Documents')
        if (!simpleCheckIcloudPath(absPath, homePath)) {
            // 简单判断无法通过则复杂验证
            const allFiles = walk(iCloudRoot)
            for (const file of allFiles) {
                if (-1 < absPathLower.indexOf(file.toLowerCase())) {
                    return true
                }
            }
        }
        return false
    }

    // 简单判断 iCloud 同步目录
    // 不允许 为桌面 文档 和 iCloud 文件夹 和软链接
    const simpleCheckIcloudPath = (absPath, homePath) => {
        const fs = require('fs')
        let stat = fs.lstatSync(absPath)
        if (stat.isSymbolicLink()) {
            return false
        }

        const path = require('path')
        const absPathLower = absPath.toLowerCase()
        const iCloudRoot = path.join(homePath, 'Library', 'Mobile Documents')
        if (absPathLower.startsWith(iCloudRoot.toLowerCase())) {
            return false
        }

        const documentsRoot = path.join(homePath, 'Documents')
        if (absPathLower.startsWith(documentsRoot.toLowerCase())) {
            return false
        }

        const desktopRoot = path.join(homePath, 'Desktop')
        if (absPathLower.startsWith(desktopRoot.toLowerCase())) {
            return false
        }
        return true
    }

    const walk = (dir, files = []) => {
        let dirFiles;
        const fs = require('fs')
        try {
            if (!fs.existsSync(dir)) {
                console.log("dir [" + dir + "] not exists")
                return files
            }
            dirFiles = fs.readdirSync(dir)
        } catch (e) {
            console.error("read dir [" + dir + "] failed: ", e)
            return files
        }

        const path = require('path')
        for (const f of dirFiles) {
            let stat = fs.lstatSync(dir + path.sep + f)
            if (stat.isSymbolicLink()) {
                files.push(fs.readlinkSync(dir + path.sep + f))
                continue
            }
            if (stat.isDirectory()) {
                // 如果已经遍历过则不再遍历
                if (files.includes(dir + path.sep + f)) {
                    continue
                }
                files.push(dir + path.sep + f)
                walk(dir + path.sep + f, files)
            }
        }
        return files
    }

</script>
