<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <style>
        html {
            overflow: hidden;
            height: 100%;
        }

        body {
            height: 100%;
            margin: 0;
            background: #101218;
            font-size: 12px;
            font-family: "Helvetica Neue", "Luxi Sans", "DejaVu Sans", "Hiragino Sans GB", "Microsoft Yahei", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Segoe UI Symbol", "Android Emoji", "EmojiSymbols";
        }

        #startupShell {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #101218;
        }

        #startupBackground {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, .09), transparent 28%),
                radial-gradient(circle at 82% 14%, rgba(255, 173, 112, .16), transparent 26%),
                radial-gradient(circle at 74% 82%, rgba(101, 212, 192, .12), transparent 30%),
                linear-gradient(180deg, rgba(20, 22, 28, .98), rgba(11, 13, 18, 1));
        }

        #startupImage {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transform: scale(1);
            filter: none;
            transition: opacity 180ms ease;
            pointer-events: none;
            user-select: none;
        }

        #startupOverlay {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 32px;
            text-align: center;
            color: #f7f8fc;
            background: linear-gradient(180deg, rgba(8, 9, 13, .24), rgba(8, 9, 13, .68));
        }

        #startupTitle {
            font-size: 36px;
            line-height: 1.1;
            font-weight: 700;
            letter-spacing: .02em;
        }

        #details {
            width: min(520px, calc(100vw - 64px));
            min-height: 48px;
            box-sizing: border-box;
            color: rgba(247, 248, 252, .86);
            font-size: 16px;
            line-height: 1.55;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        #progressTrack {
            width: min(360px, calc(100vw - 72px));
            height: 6px;
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, .14);
        }

        #progress {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, rgba(255, 184, 110, .82), rgba(255, 241, 233, .98), rgba(108, 220, 205, .82));
            transition: width 120ms cubic-bezier(0, 0, .2, 1);
        }
    </style>
</head>
<body>
<div id="startupShell">
    <div id="startupBackground"></div>
    <img id="startupImage" alt="" src="./startup-logo.png" style="opacity: 1;"/>
    <div id="startupOverlay">
        <div id="startupTitle">源流 SourceFlow</div>
        <div id="details"></div>
        <div id="progressTrack"><div id="progress"></div></div>
    </div>
</div>
<script>
    const STARTUP_PAGE_DATA_URL_PATTERN = /^data:image\/(?:svg\+xml|png|jpe?g|gif|webp)(?:;[^,]*)?,/i
    const STARTUP_PAGE_REMOTE_PATTERN = /^(https?:\/\/|file:\/\/)/i
    const DEFAULT_STARTUP_IMAGE = './startup-logo.png'
    let currentStartupObjectURL = ''

    const getSearch = (key) => {
        return new URLSearchParams(window.location.search).get(key) || ''
    }

    const requestJSON = (url) => {
        if (location.protocol.startsWith('http')) {
            return fetch(url, {cache: 'no-store'}).then((response) => {
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`)
                }
                return response.json()
            })
        }
        if (typeof require === 'function') {
            return new Promise((resolve, reject) => {
                try {
                    const urlObject = new URL(url)
                    const transport = require(urlObject.protocol === 'https:' ? 'https' : 'http')
                    const request = transport.request(urlObject, {method: 'GET'}, (response) => {
                        let text = ''
                        response.setEncoding('utf8')
                        response.on('data', (chunk) => {
                            text += chunk
                        })
                        response.on('end', () => {
                            if ((response.statusCode || 0) >= 400) {
                                reject(new Error(`HTTP ${response.statusCode}`))
                                return
                            }
                            try {
                                resolve(JSON.parse(text || '{}'))
                            } catch (error) {
                                reject(error)
                            }
                        })
                    })
                    request.on('error', reject)
                    request.end()
                } catch (error) {
                    reject(error)
                }
            })
        }
        return Promise.reject(new Error('No transport available'))
    }

    const normalizeStartupPageImage = (value) => {
        const normalized = `${value || ''}`.trim()
        if (!normalized) {
            return ''
        }
        if (STARTUP_PAGE_DATA_URL_PATTERN.test(normalized)) {
            return normalized
        }
        return STARTUP_PAGE_REMOTE_PATTERN.test(normalized) ? normalized : ''
    }

    const normalizeStartupPageOpacity = (value) => {
        const normalized = Math.round(Number(value))
        if (!Number.isFinite(normalized)) {
            return 100
        }
        return Math.min(100, Math.max(0, normalized))
    }

    const normalizeStartupPageBlur = (value) => {
        const normalized = Math.round(Number(value))
        if (!Number.isFinite(normalized)) {
            return 0
        }
        return Math.min(32, Math.max(0, normalized))
    }

    const isLocalStartupImage = (value) => {
        return STARTUP_PAGE_DATA_URL_PATTERN.test(`${value || ''}`.trim())
    }

    const getRenderableStartupImageURL = (value) => {
        if (!STARTUP_PAGE_DATA_URL_PATTERN.test(`${value || ''}`)) {
            return `${value || ''}`.trim()
        }
        try {
            const normalized = `${value || ''}`.trim()
            const commaIndex = normalized.indexOf(',')
            if (commaIndex < 0) {
                return normalized
            }
            const header = normalized.slice(5, commaIndex)
            const payload = normalized.slice(commaIndex + 1)
            const mime = (header.split(';')[0] || 'image/png').trim() || 'image/png'
            let blob
            if (/;base64/i.test(header)) {
                const decoded = atob(payload.replace(/\s+/g, ''))
                const bytes = new Uint8Array(decoded.length)
                for (let i = 0; i < decoded.length; i++) {
                    bytes[i] = decoded.charCodeAt(i)
                }
                blob = new Blob([bytes], {type: mime})
            } else {
                blob = new Blob([decodeURIComponent(payload)], {type: mime})
            }
            if (currentStartupObjectURL) {
                URL.revokeObjectURL(currentStartupObjectURL)
                currentStartupObjectURL = ''
            }
            currentStartupObjectURL = URL.createObjectURL(blob)
            return currentStartupObjectURL
        } catch (e) {
            return `${value || ''}`.trim()
        }
    }

    const loadStartupAppearance = () => {
        const workspace = decodeURIComponent(getSearch('workspace') || '')
        if (!workspace || typeof require !== 'function') {
            return {
                image: DEFAULT_STARTUP_IMAGE,
                opacity: 100,
                blur: 0,
            }
        }
        try {
            const fs = require('fs')
            const path = require('path')
            const confPath = path.join(workspace, 'conf', 'conf.json')
            if (!fs.existsSync(confPath)) {
                return {
                    image: DEFAULT_STARTUP_IMAGE,
                    opacity: 100,
                    blur: 0,
                }
            }
            const conf = JSON.parse(fs.readFileSync(confPath).toString())
            const appearance = conf?.appearance || {}
            const startupPageImage = normalizeStartupPageImage(appearance.startupPageImage)
            if (!startupPageImage) {
                return {
                    image: DEFAULT_STARTUP_IMAGE,
                    opacity: 100,
                    blur: 0,
                }
            }
            return {
                image: startupPageImage,
                opacity: normalizeStartupPageOpacity(appearance.startupPageOpacity),
                blur: normalizeStartupPageBlur(appearance.startupPageBlur),
            }
        } catch (e) {
            return {
                image: DEFAULT_STARTUP_IMAGE,
                opacity: 100,
                blur: 0,
            }
        }
    }

    const applyStartupAppearance = (nextConfig) => {
        const config = nextConfig || loadStartupAppearance()
        if (!config) {
            return
        }
        const backgroundElement = document.getElementById('startupBackground')
        const imageElement = document.getElementById('startupImage')
        const localImage = isLocalStartupImage(config.image)
        const renderURL = localImage ? `${config.image || ''}`.trim() : getRenderableStartupImageURL(config.image)
        if (localImage) {
            backgroundElement.style.backgroundImage = 'none'
            backgroundElement.style.backgroundPosition = ''
            backgroundElement.style.backgroundRepeat = ''
            backgroundElement.style.backgroundSize = ''
        } else {
            backgroundElement.style.backgroundImage = `url("${renderURL.replace(/"/g, '\\"')}")`
            backgroundElement.style.backgroundPosition = 'center'
            backgroundElement.style.backgroundRepeat = 'no-repeat'
            backgroundElement.style.backgroundSize = 'cover'
        }
        imageElement.style.filter = `blur(${config.blur}px)`
        imageElement.style.transform = `scale(${1 + config.blur / 60})`
        imageElement.onload = () => {
            imageElement.style.opacity = `${config.opacity / 100}`
        }
        imageElement.onerror = () => {
            if (renderURL !== DEFAULT_STARTUP_IMAGE) {
                imageElement.onerror = null
                imageElement.style.filter = 'none'
                imageElement.style.transform = 'scale(1)'
                imageElement.style.opacity = '1'
                imageElement.src = DEFAULT_STARTUP_IMAGE
                return
            }
            imageElement.removeAttribute('src')
            imageElement.style.opacity = '0'
        }
        imageElement.src = renderURL
        if (imageElement.complete && imageElement.naturalWidth > 0) {
            imageElement.style.opacity = `${config.opacity / 100}`
        }
    }

    const bindBootAppearanceIPC = () => {
        if (typeof require !== 'function') {
            return
        }
        try {
            const {ipcRenderer} = require('electron')
            ipcRenderer?.on('sourceflow-boot-appearance', (_event, config) => {
                applyStartupAppearance(config || undefined)
            })
        } catch (e) {
            // ignore and keep file-read fallback
        }
    }

    const updateProgress = (progress, details) => {
        const progressElement = document.getElementById('progress')
        const detailsElement = document.getElementById('details')
        if (progressElement) {
            progressElement.style.width = `${Math.min(100, Math.max(0, Number(progress) || 0))}%`
        }
        if (detailsElement && details) {
            detailsElement.textContent = details
        }
    }

    const trackKernelBoot = async () => {
        const v = getSearch('v')
        const port = parseInt(getSearch('port') || location.port || '0', 10)
        const baseURL = port ? `http://127.0.0.1:${port}` : (location.protocol.startsWith('http') ? window.location.origin : '')
        updateProgress(8, `${v ? `v${v} ` : ''}正在启动内核…`)
        if (!baseURL) {
            return
        }
        while (true) {
            try {
                await requestJSON(`${baseURL}/api/system/version`)
                break
            } catch (e) {
                await sleep(180)
            }
        }
        while (true) {
            try {
                const progressData = await requestJSON(`${baseURL}/api/system/bootProgress`)
                const progress = progressData?.data?.progress || 0
                updateProgress(progress, progressData?.data?.details || `${v ? `v${v} ` : ''}正在载入工作空间与笔记界面…`)
                if (progress >= 100) {
                    break
                }
            } catch (e) {
            }
            await sleep(120)
        }
    }

    (() => {
        bindBootAppearanceIPC()
        applyStartupAppearance()
        void trackKernelBoot()
    })()
</script>
</body>
</html>
